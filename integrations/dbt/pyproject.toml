[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlassert-dbt"
dynamic = ["version"]
description = "Check a dbt project's tests and sqlassert markers from its compiled manifest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fred Israel" }]
requires-python = ">=3.13"
keywords = ["dbt", "sql", "static-analysis", "data-quality", "sqlassert"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
]
# Reads target/manifest.json only: dbt itself is needed to compile the
# project, not to check it, so it is a test dependency here.
dependencies = [
  "sqlassert>=0.3.1",
  "sqlglot>=30.30,<31",
]

[project.urls]
Homepage = "https://github.com/polvoazul/sqlassert/tree/main/integrations/dbt"
Issues = "https://github.com/polvoazul/sqlassert/issues"

[project.scripts]
sqlassert-dbt = "sqlassert_dbt.__main__:main"

[project.optional-dependencies]
test = [
  "dbt-core>=1.12",
  "dbt-duckdb>=1.11",
  "pytest",
]

[tool.setuptools.packages.find]
include = ["sqlassert_dbt", "sqlassert_dbt.*"]

[tool.setuptools_scm]
root = "../.."
local_scheme = "no-local-version"

# In this repository the plugin builds and tests against the sibling sqlassert.
[tool.uv.sources]
sqlassert = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]

[tool.ty.environment]
extra-paths = ["../.."]
