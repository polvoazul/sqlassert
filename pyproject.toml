[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlassert"
dynamic = ["version"]
description = "Generate SQL assertions from unique join markers."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "case-conversion>=3.0.2",
  "sqlglot>=28,<31",
]

[project.scripts]
sqlassert = "sqlassert.__main__:main"

[project.optional-dependencies]
duckdb = [
  "duckdb>=1.1",
]
test = [
  "duckdb>=1.1",
  "hypothesis",
  "pytest",
  "pytest-xdist",
]
dev = [
  "ty",
]

[tool.setuptools.packages.find]
include = ["sqlassert*"]

[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = ["tests"]

[tool.ty.src]
exclude = ["build", "dist"]

[tool.setuptools_scm]

[tool.poetry]
version = "0.0.0"
