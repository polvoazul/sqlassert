[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlassert"
version = "0.1.0"
description = "Generate SQL assertions from unique join markers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sqlglot>=28",
]

[project.optional-dependencies]
test = [
  "duckdb",
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
