[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlassert"
dynamic = ["version"]
description = "Asserts and static proofs for your SQL, without touching your data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fred Israel" }]
requires-python = ">=3.13"
keywords = ["sql", "static-analysis", "linter", "dbt", "data-quality", "join", "cardinality", "sqlglot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: SQL",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "case-conversion>=3.0.2",
  "sqlglot>=30.30,<31",
]

[project.urls]
Homepage = "https://github.com/polvoazul/sqlassert"
Issues = "https://github.com/polvoazul/sqlassert/issues"

[project.scripts]
sqlassert = "sqlassert_cli:main"

[project.optional-dependencies]
test = [
  "duckdb>=2.0",
  "hypothesis",
  "pytest",
  "pytest-xdist",
]
dev = [
  "ty>=0.0.104",
]

[tool.setuptools]
py-modules = ["sqlassert_cli"]

[tool.setuptools.packages.find]
include = ["sqlassert", "sqlassert.*"]

[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = ["tests"]

[tool.ty.src]
exclude = ["build", "dist"]

[tool.setuptools_scm]
# PyPI rejects local versions (+g<hash>): a main build is X.Y.Z.devN.
local_scheme = "no-local-version"

[tool.poetry]
version = "0.0.0"
